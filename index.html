<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RD Estoque Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div id="loginBox" class="login-box">
  <h1>RD Estoque Pro</h1>
  <input type="text" id="user" placeholder="Usuário">
  <input type="password" id="pass" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <p>Usuário: <b>admin</b> | Senha: <b>1234</b></p>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <h2>RD <span>ESTOQUE</span></h2>
    <button onclick="toggleTheme()">🌙 Modo</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <input type="text" id="busca" placeholder="Buscar produto..." oninput="render()">
    </header>

    <section class="cards">
      <div class="card"><span>Produtos</span><h3 id="totalProdutos">0</h3></div>
      <div class="card"><span>Quantidade</span><h3 id="totalQtd">0</h3></div>
      <div class="card"><span>Valor Total</span><h3 id="totalValor">R$ 0,00</h3></div>
      <div class="card"><span>Estoque Baixo</span><h3 id="baixo">0</h3></div>
    </section>

    <section class="toolbar">
      <input type="text" id="nome" placeholder="Produto">
      <input type="number" id="qtd" placeholder="Qtd">
      <input type="number" id="preco" step="0.01" placeholder="Preço">
      <button onclick="adicionar()">Adicionar</button>
      <button onclick="exportar()" class="excel">Excel</button>
    </section>

    <div class="tabela">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Preço</th>
            <th>Total</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
